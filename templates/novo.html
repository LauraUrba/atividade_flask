{% extends "base.html" %}
{% block conteudo %}

    <h2>Cadastrar Novos Produtos</h2>

   {% if erro %}
        <ul>
            {% for erro in erros %}
                <li>{{ erro }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="POST">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" value="{{ nome or request.form.get('nome', '') }}">

        <label for="preco">Preço:</label>
        <input type="number" id="preco" name="preco" step="0.01" value="{{ preco or request.form.get('preco', '') }}">

        <label for="estoque">Quantidade em Estoque:</label>
        <input type="number" id="estoque" name="estoque" min="0" value="{{ estoque or request.form.get('estoque', '0') }}">

        <label for="categoria">Categoria:</label>
        <select id="categoria" name="categoria">
            <option value="">Selecione</option>
            <option value="Informática" {% if categoria =='Informática' %}selected{% endif %}>Informática</option>
            <option value="Acessórios" {% if categoria =='Acessórios' %}selected{% endif %}>Acessórios</option>
        </select>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" name="descricao">{{ descricao or request.form.get('descricao', '') }}</textarea>

        <!-- Botão de confirmação -->
        {% if confirmado %}
            <input type="hidden" name="confirmado" value="sim">
            <button type="submit" class="btn-confirar">
                Confirmar Cadastro
            </button>
        {% else %}
            <button type="submit" class="btn-cadastrar">Cadastrar</button>
        {% endif %}
    </form>

{% endblock %}
