{% extends "base.html" %}
{% block conteudo %}
     <h2>Editar produto</h2>

     {% with messages = get_flashed_messages(with_categories=true) %}
         {% if messages %}
             {% for category, message in messages %}
                 <div class="flash-{{ category }}">{{ message }}</div>
             {% endfor %}
         {% endif %}
     {% endwith %}

     <form method="POST">
         <label for="nome">Nome:</label>
         <input type="text" id="nome" name="nome"
            value="{{ produto.nome }}" required>

         <label for="preco">Preço:</label>
         <input type="number" id="preco" name="preco" step="0.01" min="0.01"
             value="{{ produto.preco }}" required>

         <!-- Campo Estoque -->
         <label for="estoque">Estoque:</label>
         <input type="number" id="estoque" name="estoque" min="0"
             value="{{ produto.estoque }}" required>

         <label for="categoria">Categoria:</label>
         <select id="categoria" name="categoria">
             <option value="Informática"
                 {% if produto.categoria == "Informática" %}
                 selected
                 {% endif %}>
                 Informática
             </option>
             <option value="Acessórios"
                 {% if produto.categoria == "Acessórios" %}
                 selected
                 {% endif %}>
                 Acessórios
             </option>
         </select>

         <label for="descricao">Descrição:</label>
         <textarea id="descricao" name="descricao">{{ produto.descricao }}</textarea>

         <button type="submit">Salvar</button>
         <a href="{{ url_for('index') }}">Cancelar</a>
     </form>
{% endblock %}
